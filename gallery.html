<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game BBang · 원화 검토</title><link rel="stylesheet" href="style.css?v=1.0.0-beta.3"><style>main{max-width:900px;margin:auto;padding:24px 16px}h1{font-size:24px}p{line-height:1.7;color:#c1cbbd}.samples,.month{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:18px 0 32px}.samples .card{--w:84px}.month .card{--w:70px}section{border-top:1px solid #c6ac7333;padding-top:10px}section h2{font-size:16px}small{display:block;margin-top:8px}article{text-align:center}</style><main><h1>우리집 화투 · 원화 검토</h1><p>직접 제작한 벡터 그림 · 월별 식물과 패별 상징 · 규칙 변경 없음</p><h2>대표 6종</h2><div class="samples" id="samples"></div><div id="all"></div></main><script src="engine.js?v=1.0.0-beta.3"></script><script src="artwork.js?v=1.0.0-beta.3"></script><script>// ===== 화면 =====
function cardHTML(c,cls='',extra=''){
  if(c===null||c===undefined)return `<div class="card back ${cls}">${cardBackArt()}</div>`;
  const m=cm(c),interactive=extra.includes('onclick='),tag=interactive?'button':'div';
  return `<${tag} ${interactive?`type="button" aria-label="${m}월 ${MN[m]} ${sym(c)}"`:""} class="card k-${ck(c)} ${cls}" style="--mc:${MCOL[m]}" data-id="${c}" ${extra}><span class="mo">${m}</span><span class="sym">${sym(c)}</span>${cardArt(c)}<span class="nm">${MN[m]}</span></${tag}>`;
}
document.getElementById("samples").innerHTML=[0,36,1,21,2,47].map(c=>"<article>"+cardHTML(c)+"<small>"+sym(c)+"</small></article>").join("");document.getElementById("all").innerHTML=Array.from({length:12},(_,i)=>"<section><h2>"+(i+1)+"월 · "+MN[i+1]+"</h2><div class=month>"+Array.from({length:4},(_,j)=>cardHTML(i*4+j)).join("")+"</div></section>").join("");</script></html>
