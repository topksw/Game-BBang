<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game BBang · 실제 두 폰 검사</title><link rel="stylesheet" href="style.css?v=1.0.0-beta.5.1"><style>main{max-width:720px;margin:auto;padding:24px 18px}h1{font-size:25px}p{line-height:1.7}.case{padding:13px 0;border-bottom:1px solid #c6ac7333}.case label{font-size:15px;color:#f4e9cc;margin:0 0 8px}.case select{padding:10px;font:inherit;background:#173e34;color:#fff;width:100%;border:1px solid #c6ac7355;border-radius:8px}.case input{margin-top:7px}.row{flex-wrap:wrap}textarea{width:100%;min-height:140px;font:12px monospace;user-select:text}a{color:#efd49b}.notice{background:#f0d79a;color:#29251c;padding:14px;border-radius:10px}#qaSummary{font-weight:bold;line-height:1.8}</style></head><body><main><h1>실제 두 폰 승인 검사</h1><p class="notice">이 화면은 자동으로 검사하지 않아요. 실제 두 폰에서 직접 확인한 결과만 입력해줘. 빈 항목·실패·미실시가 남으면 1.0 승인 완료가 아니에요.</p><p>초대 링크·비밀값·손패·이름·전화번호는 입력하지 말아줘. 기록은 이 브라우저에만 저장되고 서버로 전송하지 않아요.</p><label for="devices">두 기종 · OS · 브라우저 · 망 조합</label><input id="devices" maxlength="300" placeholder="예: Android Chrome / iPhone Safari · 와이파이와 LTE"><p id="qaSummary" role="status"></p><div id="cases"></div><div class="row" style="margin-top:20px"><button class="btn" id="exportQa">기록 JSON 내려받기</button><button class="btn2" id="copyQa">기록 텍스트 보기</button></div><textarea id="qaText" readonly hidden aria-label="기기 검사 기록"></textarea><p id="qaStatus" role="status"></p><p><a href="./">게임으로 돌아가기</a></p></main><script>
const cases=['설명 없이 방 생성→초대→참가→다음 판','같은 와이파이 10판, 패·점수 불일치 0','와이파이↔모바일 데이터 10판, 불일치 0','각자 모바일 데이터로 연결','카톡 링크를 실제 Chrome/Safari로 열기','패 선택·고스톱·결과 각각 잠금 30초 후 복귀','앱 전환 1분·5분 후 복귀','참가자 새로고침 또는 최근 방 재참가','방장 종료→이어하기→최신 초대로 같은 판 복귀','방 코드 변경 후 최신 링크로 자리 복귀','통신 30초 끊기→재시도 안내·복구','한 명만 다음 판 준비하면 기다리기','후반 획득 패·초보자 모드·패 확대·상세','회전·뒤로가기·취소·홈 화면 바로가기','저장 경고·버전 차이 안내·양쪽 갱신','설명 없는 무한 대기·강제 초기화 멈춤 0'];
const key=(location.pathname.includes('/preview/')?'bbang-preview-':'bbang-')+'device-acceptance-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch(e){};document.getElementById('devices').value=saved.devices||'';document.getElementById('cases').innerHTML=cases.map((c,i)=>'<div class="case"><label for="c'+i+'">'+(i+1)+'. '+c+'</label><select id="c'+i+'"><option value="">아직 확인하지 않음</option><option value="pass">실제 폰에서 통과</option><option value="fail">실패</option><option value="na">미실시</option></select><input id="n'+i+'" maxlength="200" placeholder="날짜·기기/망·결과 메모 (비밀값 제외)" aria-label="'+(i+1)+'번 검사 메모"></div>').join('');for(let i=0;i<cases.length;i++){document.getElementById('c'+i).value=saved.results?.[i]?.status||'';document.getElementById('n'+i).value=saved.results?.[i]?.note||'';}
function record(){const results=cases.map((name,i)=>({name,status:document.getElementById('c'+i).value,note:document.getElementById('n'+i).value}));const devices=document.getElementById('devices').value;return {kind:'manual-physical-device-test',app:'Game BBang',candidate:'1.0.0-beta.5.1',at:new Date().toISOString(),devices,accepted:!!devices.trim()&&results.every(r=>r.status==='pass'),results};}
function change(){const r=record(),pass=r.results.filter(x=>x.status==='pass').length;document.getElementById('qaSummary').textContent=pass+'/'+cases.length+' 통과 · '+(r.accepted?'모든 항목을 통과로 기록했어요. 실제 수행 여부와 기록을 검토한 뒤 별도 배포 승인이 필요해요.':'승인 미완료');try{localStorage.setItem(key,JSON.stringify(r));document.getElementById('qaStatus').textContent='이 브라우저에 기록했어요.';}catch(e){document.getElementById('qaStatus').textContent='저장 실패. 기록 텍스트를 보관해줘.';}}
document.addEventListener('input',change);document.addEventListener('change',change);document.getElementById('copyQa').onclick=()=>{const t=document.getElementById('qaText');t.hidden=false;t.value=JSON.stringify(record(),null,2);t.focus();t.select();};document.getElementById('exportQa').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(record(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='Game-BBang-device-check.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};change();</script></body></html>
